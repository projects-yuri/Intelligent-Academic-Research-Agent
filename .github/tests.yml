name: Python tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check source and execute tests
        run: |
          python -m compileall -q app.py agent.py tools.py papers.py
          python -m unittest discover -s tests -v
